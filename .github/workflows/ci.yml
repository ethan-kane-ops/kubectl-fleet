name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go run ./cmd/gendocs && git diff --exit-code docs
      - run: go vet ./...
      - run: go test -race ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go install sigs.k8s.io/kind@v0.32.0
      # Pinned release from GitHub, checksum-verified; the step fails if the
      # download does. (The just.systems installer exited 0 on a 504, so the
      # job died later with "just: command not found".)
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.47.0
      - run: just e2e-up
      - run: just e2e-test
      - if: always()
        run: just e2e-down
